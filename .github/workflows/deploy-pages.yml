name: Deploy coursework to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'practice-2/**'
      - 'practice-1/**'
      - 'practice-3/**'
      - 'practice-4/**'
      - 'practice-7/**'
      - 'practice-8/**'
      - 'midterm/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            practice-2/package-lock.json
            practice-3/package-lock.json
            practice-4/package-lock.json
            practice-7/package-lock.json
            practice-8/package-lock.json
            midterm/package-lock.json
      - name: Install
        working-directory: practice-2
        run: npm ci
      - name: Lint
        working-directory: practice-2
        run: npm run lint
      - name: Build
        working-directory: practice-2
        run: npm run build
      - name: Install practice 3
        working-directory: practice-3
        run: npm ci
      - name: Lint practice 3
        working-directory: practice-3
        run: npm run lint
      - name: Build practice 3
        working-directory: practice-3
        run: npm run build
      - name: Install practice 4
        working-directory: practice-4
        run: npm ci
      - name: Lint practice 4
        working-directory: practice-4
        run: npm run lint
      - name: Test practice 4
        working-directory: practice-4
        run: npm test
      - name: Build practice 4
        working-directory: practice-4
        run: npm run build
      - name: Install midterm
        working-directory: midterm
        run: npm ci
      - name: Lint midterm
        working-directory: midterm
        run: npm run lint
      - name: Test midterm
        working-directory: midterm
        run: npm test
      - name: Build midterm
        working-directory: midterm
        run: npm run build
      - name: Install practice 7
        working-directory: practice-7
        run: npm ci
      - name: Verify practice 7
        working-directory: practice-7
        run: npm run lint && npm test && npm run test:ui
      - name: Build practice 7
        working-directory: practice-7
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
        run: npm run build && npm run test:pwa
      - name: Install practice 8
        working-directory: practice-8
        run: npm ci
      - name: Verify practice 8
        working-directory: practice-8
        run: npm run lint && npm test && npm run test:ui
      - name: Build practice 8
        working-directory: practice-8
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.PRACTICE8_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.PRACTICE8_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.PRACTICE8_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.PRACTICE8_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PRACTICE8_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.PRACTICE8_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
        run: npm run build && npm run test:pwa
      - name: Assemble Pages site
        run: |
          mkdir -p _site/practice-8 _site/practice-7 _site/practice-2 _site/practice-3 _site/practice-4 _site/modterm
          cp -R midterm/dist/. _site/modterm/
          cp -R practice-2/dist/. _site/practice-2/
          cp -R practice-3/dist/. _site/practice-3/
          cp -R practice-4/dist/. _site/practice-4/
          cp -R practice-8/dist/. _site/practice-8/
          cp -R practice-7/dist/. _site/practice-7/
          cp -R practice-1 _site/practice-1
          cp -R midterm/dist/. _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
