<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243d32"><title>Полка · нет соединения</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f7f3;color:#243d32;font:18px/1.6 system-ui;padding:24px}main{max-width:560px;margin:12vh auto}h1{font-size:clamp(30px,7vw,48px)}button,a{display:inline-block;padding:14px 20px;border-radius:12px;background:#243d32;color:white;border:0;font:inherit;margin:8px 8px 8px 0}p{overflow-wrap:anywhere}</style><main><span>ПОЛКА / OFFLINE</span><h1>Связь потерялась.<br>Книги остались.</h1><p>Эта страница не была сохранена. Откройте приложение: ваша локальная полка и ранее загруженный публичный каталог доступны без сети.</p><button id="retry">Проверить соединение</button><a id="home">Открыть полку</a><p id="status" role="status"></p></main><script>const base=new URL('__APP_BASE__'.startsWith('http')?'__APP_BASE__':'./',location.href);document.querySelector('#home').href=base+'#/';document.querySelector('#retry').onclick=async()=>{const s=document.querySelector('#status');s.textContent='Проверяем…';try{const r=await fetch(new URL('connection-check.txt?'+Date.now(),base),{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error();location.href=base+'#/';}catch{s.textContent='Соединение пока недоступно. Попробуйте позже.'}};</script></html>
